<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Master • Private</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;color:#fff;display:flex;min-height:100vh}
.left{flex:1.2;background:radial-gradient(1200px 600px at -10% -10%, #c9a86a22, transparent), #111;padding:60px;display:flex;flex-direction:column;justify-content:space-between}
.brand{font-weight:700;letter-spacing:.2em;font-size:14px;color:#c9a86a}
.hero h1{font-size:48px;line-height:1.1;margin:20px 0;font-weight:700}
.hero h1 span{color:#c9a86a}
.hero p{color:#888;max-width:420px;line-height:1.6}
.card-preview{margin-top:40px;background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:1px solid #222;border-radius:20px;padding:24px;width:360px}
.right{flex:1;background:#fafaf9;display:flex;align-items:center;justify-content:center;padding:40px}
.box{width:100%;max-width:360px}
.box h2{color:#111;font-size:28px;margin-bottom:8px}
.box .sub{color:#888;font-size:14px;margin-bottom:32px}
input{width:100%;padding:14px 16px;border:1px solid #e5e5e5;border-radius:12px;margin-bottom:14px;background:#fff;color:#111;outline:none}
input:focus{border-color:#c9a86a}
button{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:12px;font-weight:600;cursor:pointer;margin-top:8px}
button:hover{background:#000}
.foot{margin-top:32px;color:#aaa;font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="left">
<div class="brand">BANCO MASTER • PRIVATE BANK</div>
<div class="hero">
<h1>Seu patrimônio.<br><span>Sem fricção.</span></h1>
<p>Banco Master Private. Conta internacional, cartão Black e PIX ilimitado em uma experiência 100% criptografada.</p>
</div>
<div style="color:#444;font-size:11px">© 2026 Banco Master S.A.</div>
</div>
<div class="right">
<div class="box">
<h2>Bem-vindo de volta</h2>
<div class="sub">Acesse sua conta Private</div>
<form method="POST" action="/login">
<input name="username" placeholder="Usuário" required autocomplete="off">
<input name="password" type="password" placeholder="Senha" required autocomplete="new-password">
<button type="submit">Entrar no Private →</button>
</form>
<div class="foot">Ambiente seguro • Criptografia de 256 bits</div>
</div>
</div>
</div>
</body>
</html>
